<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盧琴樹 雙11 抽獎｜門市管理頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261029j">
<style>
  .admin-page .card { padding: 22px 18px; }
  .admin-head { display: flex; flex-direction: column; gap: 4px; }
  .admin-head .form-title { margin-bottom: 0; }
  .admin-table-wrap { overflow: auto; margin-top: 16px; border-radius: 14px; border: 1px solid #e6d8c4; background: #fff; max-height: 62vh; }
  .admin-table-wrap:empty { display: none; }
  table.admin { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .84rem; }
  table.admin th, table.admin td { border-bottom: 1px solid #efe4d3; padding: 9px 12px; text-align: left; white-space: nowrap; }
  table.admin th { background: var(--wine); color: var(--cream); position: sticky; top: 0; z-index: 1; font-weight: 600; letter-spacing: .04em; border-bottom: 2px solid var(--gold); }
  table.admin tbody tr:nth-child(even) td { background: #fdfaf3; }
  table.admin tbody tr:hover td { background: #f7ecd9; }
  table.admin tbody tr:last-child td { border-bottom: none; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .stat .box { background: linear-gradient(180deg, #fffdf8, var(--cream)); border: 1px solid #e2d3bf; border-top: 3px solid var(--gold); border-radius: 14px; padding: 12px 14px; text-align: center; }
  .stat .num { font-family: var(--serif); font-size: 1.9rem; font-weight: 700; color: var(--wine); line-height: 1.2; }
  .stat .lbl { font-size: .8rem; color: #7a5c64; letter-spacing: .06em; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1 1 160px; margin-top: 0; }
  .btn-danger { background: #A4231B; color: #fff; box-shadow: 0 4px 12px rgba(164, 35, 27, .3); }
  .btn-danger:hover { filter: brightness(1.08); }
  .empty-note { text-align: center; color: #93707a; padding: 28px 12px; margin: 16px 0 0; border: 1.5px dashed #e2d3bf; border-radius: 14px; background: rgba(255,255,255,.5); }
  .admin-note { font-size: .82rem; color: #93707a; margin: 18px 0 0; line-height: 1.8; padding: 12px 14px; background: rgba(251,246,238,.8); border-left: 3px solid var(--gold); border-radius: 0 10px 10px 0; }
  .admin-hero { margin: 16px 16px 0; padding: 26px 20px 24px; border-radius: 20px; text-align: center; color: var(--cream);
    background: radial-gradient(500px 220px at 50% -20%, rgba(198,161,91,.35), transparent 70%), linear-gradient(150deg, #6E2B3B 0%, var(--wine) 45%, var(--wine-dark) 100%);
    box-shadow: 0 14px 36px rgba(61,23,34,.22), 0 0 0 1px rgba(198,161,91,.4); }
  .admin-brand { margin: 0; font-family: var(--serif); font-size: 1.05rem; letter-spacing: .3em; color: var(--gold); }
  .admin-brand span { font-family: var(--sans); font-size: .7rem; letter-spacing: .25em; opacity: .85; margin-left: 6px; }
  .admin-title { margin: 6px 0 10px; font-family: var(--serif); font-size: 1.5rem; letter-spacing: .08em; }
  .admin-badge { display: inline-block; padding: 3px 14px; border-radius: 999px; border: 1px solid var(--gold); color: var(--gold); font-size: .78rem; letter-spacing: .2em; }
  .btn-ghost { display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--wine); border: 1.5px solid var(--gold); text-decoration: none; }
  .btn-ghost:hover { background: rgba(198,161,91,.12); }
  @media (min-width: 900px) {
    .admin-hero { margin: 24px 24px 0; padding: 34px 36px 30px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px; text-align: left; }
    .admin-title { margin: 0; font-size: 1.9rem; }
    .admin-head, .admin-head .form-title, .admin-head .form-hint { text-align: left; }
    .admin-page { max-width: 1120px; }
    .admin-page .wrap { padding: 0 36px 56px; }
    .admin-page .card { padding: 32px 36px; }
    .admin-page .card:hover { transform: none; }
    .admin-top { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; }
    .stat { margin-top: 0; grid-template-columns: repeat(2, 160px); }
    .admin-actions { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
    .admin-actions .btn-row { margin-top: 0; flex-wrap: nowrap; }
    .admin-actions .btn { flex: 0 0 auto; width: auto; padding-left: 26px; padding-right: 26px; }
    table.admin { font-size: .9rem; }
    table.admin th, table.admin td { padding: 11px 14px; }
  }
</style>
</head>
<body>
<div class="page admin-page">
  <header class="admin-hero">
    <p class="admin-brand">盧琴樹 <span>LUCHINSHU</span></p>
    <h1 class="admin-title">雙11 抽獎・門市管理頁</h1>
    <span class="admin-badge">店員專用</span>
  </header>

<div class="wrap">
  <section class="card">
    <div class="admin-top">
      <div class="admin-head">
        <h2 class="form-title">本機提交紀錄</h2>
        <p class="form-hint">存在這台裝置的瀏覽器裡，打烊前記得「下載 CSV」交回總部彙整。</p>
      </div>
      <div class="stat">
        <div class="box"><div class="num" id="statCount">0</div><div class="lbl">提交筆數</div></div>
        <div class="box"><div class="num" id="statDup">0</div><div class="lbl">發票／訂單重複</div></div>
      </div>
    </div>

    <div class="admin-table-wrap" id="tableWrap"></div>
    <p class="empty-note" id="emptyNote">還沒有資料，客人掃碼送出後就會出現在這裡。</p>

    <div class="admin-actions">
      <div class="btn-row">
        <button class="btn btn-gold" id="btnCsv">下載 CSV（交回總部）</button>
        <a class="btn btn-ghost" href="./index.html">← 回到表單</a>
      </div>
      <div class="btn-row">
        <button class="btn btn-danger" id="btnClear">清除本機資料</button>
      </div>
    </div>

    <p class="admin-note">
      ※ 下載的 CSV 為 UTF-8（含 BOM），Excel 直接開不會亂碼。<br>
      ※ 清除前請先確認已下載；清除只刪這台裝置的留底，不影響已送到試算表的資料。<br>
      ※ 「發票／訂單重複」是用發票號碼、訂單編號在這台裝置上粗略比對，正式去重由總部統一處理。
    </p>
  </section>

  <footer class="foot">主辦：鷹速國際有限公司（盧琴樹）｜chinshu.co</footer>
</div>
</div>

<script src="validate.js?v=20261029j"></script>
<script>
(function () {
  'use strict';
  var V = window.LotteryValidate;
  var LS_KEY = 'double11_offline_entries';
  // 與 Code.gs「線下登記」分頁相同的欄位順序（不含伺服器的重複標記）
  var HEADERS = ['提交時間', '姓名', 'Email', '電話', '消費金額', '平台', '帳號名稱', '發票號碼', '行銷同意', '門市', '來源', '通路類型', '購買通路', '訂單編號'];

  function channelLabel(e) {
    if (e.channel === 'online' || e.source === 'online-web') return '線上';
    if (e.channel === 'store' || e.source === 'offline-web') return '門市';
    if (e.orderId) return '線上';
    if (e.invoice) return '門市';
    return '';
  }
  function rowOf(e) {
    return [
      fmtTs(e.ts), e.name || '', e.email || '', e.phone || '',
      e.amount != null ? e.amount : '', e.platform || '', e.account || '',
      e.invoice || '', e.marketing ? '同意' : '', e.store || '', e.source || '',
      channelLabel(e), e.orderChannel || '', e.orderId || ''
    ];
  }

  function load() {
    try {
      var arr = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function fmtTs(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function render() {
    var entries = load();
    var wrap = document.getElementById('tableWrap');
    var empty = document.getElementById('emptyNote');
    document.getElementById('statCount').textContent = entries.length;

    var seenInv = {};
    var seenOrder = {};
    var dup = 0;
    entries.forEach(function (e) {
      var iv = V.normalizeInvoice(e.invoice);
      if (iv) { if (seenInv[iv]) dup++; else seenInv[iv] = 1; }
      var oid = V.normalizeOrderId(e.orderId);
      if (oid) { if (seenOrder[oid]) dup++; else seenOrder[oid] = 1; }
    });
    document.getElementById('statDup').textContent = dup;

    if (!entries.length) { wrap.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    var html = '<table class="admin"><thead><tr>' + HEADERS.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
    entries.slice().reverse().forEach(function (e) {
      var row = rowOf(e);
      html += '<tr>' + row.map(function (c) { return '<td>' + String(c).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</td>'; }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  document.getElementById('btnCsv').addEventListener('click', function () {
    var entries = load();
    if (!entries.length) { alert('還沒有資料可以下載喔！'); return; }
    var rows = [HEADERS];
    entries.forEach(function (e) {
      rows.push(rowOf(e));
    });
    var blob = new Blob(['\ufeff' + V.toCsv(rows)], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    a.download = 'double11_offline_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  });

  document.getElementById('btnClear').addEventListener('click', function () {
    var n = load().length;
    if (!n) { alert('本來就是空的。'); return; }
    if (confirm('確定要清除這台裝置上的 ' + n + ' 筆資料嗎？\n請先確認已下載 CSV！')) {
      localStorage.removeItem(LS_KEY);
      render();
      alert('已清除。');
    }
  });

  render();
})();
</script>
</body>
</html>
